<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Infinite Tic-Tac-Toe</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap');

        * {
            box-sizing: border-box;
            /* Mencegah highlight biru saat elemen disentuh di Android */
            -webkit-tap-highlight-color: transparent; 
        }

        body {
            background-color: #0a0a0f;
            color: #ffffff;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: manipulation; /* Mengoptimalkan respons klik di layar sentuh */
        }

        /* --- KONTROL LAYAR --- */
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding: 20px;
        }

        .screen.active {
            display: flex;
        }

        h1 {
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #ffffff;
            margin-bottom: 20px;
            text-align: center;
            font-size: clamp(1.5rem, 5vw, 2.5rem); /* Ukuran teks responsif */
        }

        h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            text-align: center;
        }

        /* --- TOMBOL --- */
        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 10px 20px;
            font-size: 1rem;
            font-family: 'Orbitron', sans-serif;
            background: transparent;
            color: #fff;
            border: 2px solid #fff;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        button:hover, button:active {
            background: #fff;
            color: #0a0a0f;
            box-shadow: 0 0 15px #fff;
        }

        .btn-blue { border-color: #00f3ff; color: #00f3ff; }
        .btn-blue:hover, .btn-blue:active { background: #00f3ff; color: #0a0a0f; box-shadow: 0 0 15px #00f3ff; }

        .btn-pink { border-color: #ff00ff; color: #ff00ff; }
        .btn-pink:hover, .btn-pink:active { background: #ff00ff; color: #0a0a0f; box-shadow: 0 0 15px #ff00ff; }

        /* --- MENU GAMBAR KUSTOM --- */
        .canvas-container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .canvas-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        canvas {
            background-color: #12121a;
            border: 2px solid #333;
            border-radius: 10px;
            cursor: crosshair;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
            /* Sangat Penting untuk Android: Mencegah layar ter-scroll saat sedang menggambar */
            touch-action: none; 
        }

        #canvas1 { border-color: #00f3ff; box-shadow: 0 0 10px rgba(0,243,255,0.3); }
        #canvas2 { border-color: #ff00ff; box-shadow: 0 0 10px rgba(255,0,255,0.3); }

        .clear-btn { margin-top: 10px; font-size: 0.8rem; padding: 5px 15px; }

        /* --- GAME BOARD --- */
        #status {
            font-size: clamp(1rem, 4vw, 1.2rem);
            margin-bottom: 20px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-align: center;
        }

        #status img {
            height: 1.5em; 
            vertical-align: middle;
        }

        .status-x { color: #00f3ff; text-shadow: 0 0 10px #00f3ff; }
        .status-o { color: #ff00ff; text-shadow: 0 0 10px #ff00ff; }

        .status-x img { filter: drop-shadow(0 0 5px #00f3ff) drop-shadow(0 0 10px #00f3ff); }
        .status-o img { filter: drop-shadow(0 0 5px #ff00ff) drop-shadow(0 0 10px #ff00ff); }

        /* GRID RESPONSIVE - Otomatis menyesuaikan layar HP */
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* Otomatis membagi layar 3 kolom rata */
            gap: clamp(5px, 2vw, 10px); /* Jarak antar kotak responsif */
            width: 90vw;          /* Lebar maksimal 90% dari layar HP */
            max-width: 400px;     /* Lebar maksimal untuk layar PC/Tablet */
            aspect-ratio: 1 / 1;  /* Menjaga bentuknya selalu persegi sempurna (Square) */
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }

        .cell {
            width: 100%;
            height: 100%;
            background-color: #12121a;
            border: 2px solid #333;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(2.5rem, 10vw, 4rem); /* Teks X/O menyesuaikan layar */
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }

        .cell:hover { background-color: #1a1a2e; }

        .cell.x {
            color: #00f3ff; border-color: #00f3ff;
            text-shadow: 0 0 15px #00f3ff, 0 0 30px #00f3ff;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4), inset 0 0 15px rgba(0, 243, 255, 0.2);
        }

        .cell.o {
            color: #ff00ff; border-color: #ff00ff;
            text-shadow: 0 0 15px #ff00ff, 0 0 30px #ff00ff;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.4), inset 0 0 15px rgba(255, 0, 255, 0.2);
        }

        .cell img {
            width: 80%;
            height: 80%;
            object-fit: contain;
        }
        
        .cell.x img { filter: drop-shadow(0 0 5px #00f3ff) drop-shadow(0 0 10px #00f3ff); }
        .cell.o img { filter: drop-shadow(0 0 5px #ff00ff) drop-shadow(0 0 10px #ff00ff); }

        /* --- ANIMASI --- */
        .cell.warning { animation: pulse-opacity 1s infinite alternate; }

        @keyframes pulse-opacity {
            0% { opacity: 1; }
            100% { opacity: 0.3; }
        }

        @keyframes neon-win-x {
            0%, 100% { box-shadow: 0 0 20px #00f3ff, inset 0 0 20px #00f3ff; }
            50% { box-shadow: 0 0 100px #00f3ff, inset 0 0 50px #00f3ff; background-color: rgba(0, 243, 255, 0.1); }
        }

        @keyframes neon-win-o {
            0%, 100% { box-shadow: 0 0 20px #ff00ff, inset 0 0 20px #ff00ff; }
            50% { box-shadow: 0 0 100px #ff00ff, inset 0 0 50px #ff00ff; background-color: rgba(255, 0, 255, 0.1); }
        }

        .board.win-x { animation: neon-win-x 0.8s ease infinite; border-radius: 10px; }
        .board.win-o { animation: neon-win-o 0.8s ease infinite; border-radius: 10px; }

        #status.win-text {
            font-size: clamp(1.5rem, 6vw, 2rem);
            animation: pulse-opacity 0.5s infinite alternate;
        }
    </style>
</head>
<body>

    <div id="screen-menu" class="screen active">
        <h1>Neon Infinite<br>Tic-Tac-Toe</h1>
        <div class="btn-group">
            <button class="btn-blue" onclick="startGame()">Mulai Game</button>
            <button class="btn-pink" onclick="goToDrawMenu()">Kustom Karakter</button>
        </div>
    </div>

    <div id="screen-draw" class="screen">
        <h1>Gambar Karaktermu</h1>
        <div class="canvas-container">
            <div class="canvas-box">
                <h2 style="color: #00f3ff;">Pemain 1 (Biru)</h2>
                <canvas id="canvas1" width="120" height="120"></canvas>
                <button class="clear-btn" onclick="clearCanvas(1)">Hapus</button>
            </div>
            <div class="canvas-box">
                <h2 style="color: #ff00ff;">Pemain 2 (Pink)</h2>
                <canvas id="canvas2" width="120" height="120"></canvas>
                <button class="clear-btn" onclick="clearCanvas(2)">Hapus</button>
            </div>
        </div>
        <div class="btn-group">
            <button onclick="saveAndStart()">Simpan & Mulai</button>
            <button onclick="goToMainMenu()">Kembali</button>
        </div>
    </div>

    <div id="screen-game" class="screen">
        <h1>Infinite Tic-Tac-Toe</h1>
        <div id="status" class="status-x">Giliran: Pemain 1</div>

        <div class="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <div class="btn-group">
            <button id="restartBtn">Main Lagi</button>
            <button onclick="goToMainMenu()">Menu Utama</button>
        </div>
    </div>

    <script>
        // --- NAVIGASI LAYAR ---
        const screenMenu = document.getElementById('screen-menu');
        const screenDraw = document.getElementById('screen-draw');
        const screenGame = document.getElementById('screen-game');

        function showScreen(screen) {
            screenMenu.classList.remove('active');
            screenDraw.classList.remove('active');
            screenGame.classList.remove('active');
            screen.classList.add('active');
        }

        function goToMainMenu() { showScreen(screenMenu); }
        function goToDrawMenu() { showScreen(screenDraw); }
        
        // --- LOGIKA MENGGAMBAR DI CANVAS (TOUCH OPTIMIZED) ---
        let customSymbol1 = null;
        let customSymbol2 = null;

        function setupCanvas(canvasId, color) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            let isDrawing = false;

            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = color;

            function getCoordinates(e) {
                const rect = canvas.getBoundingClientRect();
                // Deteksi apakah input dari sentuhan atau mouse
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                
                // Menyesuaikan rasio CSS dengan resolusi internal canvas
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;

                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            }

            function startPosition(e) {
                e.preventDefault(); // Mencegah scrolling browser di HP
                isDrawing = true;
                draw(e);
            }

            function endPosition(e) {
                if(e && e.cancelable) e.preventDefault();
                isDrawing = false;
                ctx.beginPath();
            }

            function draw(e) {
                if (!isDrawing) return;
                e.preventDefault(); // Mencegah scrolling saat jari digeser
                
                const pos = getCoordinates(e);
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
            }

            // Mouse Events (PC)
            canvas.addEventListener('mousedown', startPosition);
            canvas.addEventListener('mouseup', endPosition);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseleave', endPosition);

            // Touch Events (Android/iOS) menggunakan {passive: false} sangat penting untuk e.preventDefault()
            canvas.addEventListener('touchstart', startPosition, { passive: false });
            canvas.addEventListener('touchend', endPosition, { passive: false });
            canvas.addEventListener('touchcancel', endPosition, { passive: false });
            canvas.addEventListener('touchmove', draw, { passive: false });
        }

        setupCanvas('canvas1', '#00f3ff');
        setupCanvas('canvas2', '#ff00ff');

        function clearCanvas(playerNum) {
            const canvas = document.getElementById(`canvas${playerNum}`);
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function isCanvasEmpty(canvas) {
            const ctx = canvas.getContext('2d');
            const pixelBuffer = new Uint32Array(ctx.getImageData(0, 0, canvas.width, canvas.height).data.buffer);
            return !pixelBuffer.some(color => color !== 0);
        }

        function saveAndStart() {
            const c1 = document.getElementById('canvas1');
            const c2 = document.getElementById('canvas2');
            
            customSymbol1 = isCanvasEmpty(c1) ? null : c1.toDataURL();
            customSymbol2 = isCanvasEmpty(c2) ? null : c2.toDataURL();

            startGame();
        }

        // --- LOGIKA GAME UTAMA ---
        const cells = document.querySelectorAll('.cell');
        const statusText = document.getElementById('status');
        const restartBtn = document.getElementById('restartBtn');
        const boardElement = document.querySelector('.board');
        
        const winConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]            
        ];

        let board = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "X";
        let isGameRunning = false;
        let movesX = [];
        let movesO = [];

        function startGame() {
            if(!screenDraw.classList.contains('active') && event.target.innerText.includes('Mulai')){
                customSymbol1 = null;
                customSymbol2 = null;
                clearCanvas(1);
                clearCanvas(2);
            }
            showScreen(screenGame);
            resetBoard();
        }

        cells.forEach(cell => cell.addEventListener('click', cellClicked));
        restartBtn.addEventListener('click', resetBoard);

        function cellClicked() {
            const cellIndex = this.getAttribute('data-index');
            if (board[cellIndex] !== "" || !isGameRunning) return;
            updateCell(this, cellIndex);
            checkWinner();
        }

        function updateCell(cell, index) {
            board[index] = currentPlayer;
            
            if (currentPlayer === "X") {
                cell.innerHTML = customSymbol1 ? `<img src="${customSymbol1}" alt="P1">` : "X";
                cell.classList.add('x');
            } else {
                cell.innerHTML = customSymbol2 ? `<img src="${customSymbol2}" alt="P2">` : "O";
                cell.classList.add('o');
            }

            let currentMoves = (currentPlayer === "X") ? movesX : movesO;
            currentMoves.push(index);

            if (currentMoves.length > 3) {
                let oldestMoveIndex = currentMoves.shift(); 
                board[oldestMoveIndex] = ""; 
                
                let oldestCell = document.querySelector(`.cell[data-index="${oldestMoveIndex}"]`);
                oldestCell.innerHTML = "";
                oldestCell.classList.remove('x', 'o', 'warning');
            }

            updateWarnings();
        }

        function updateWarnings() {
            cells.forEach(c => c.classList.remove('warning'));
            if (movesX.length === 3) {
                let oldestXCell = document.querySelector(`.cell[data-index="${movesX[0]}"]`);
                if(oldestXCell) oldestXCell.classList.add('warning');
            }
            if (movesO.length === 3) {
                let oldestOCell = document.querySelector(`.cell[data-index="${movesO[0]}"]`);
                if(oldestOCell) oldestOCell.classList.add('warning');
            }
        }

        function changePlayer() {
            currentPlayer = (currentPlayer === "X") ? "O" : "X";
            updateStatusText();
        }

        function updateStatusText() {
            let symbolDisplay = "";
            if (currentPlayer === "X") {
                symbolDisplay = customSymbol1 ? `<img src="${customSymbol1}" alt="P1">` : "X";
            } else {
                symbolDisplay = customSymbol2 ? `<img src="${customSymbol2}" alt="P2">` : "O";
            }

            statusText.innerHTML = `Giliran: ${symbolDisplay}`;
            statusText.className = (currentPlayer === "X") ? 'status-x' : 'status-o';
        }

        function checkWinner() {
            let roundWon = false;

            for (let i = 0; i < winConditions.length; i++) {
                const condition = winConditions[i];
                const cellA = board[condition[0]];
                const cellB = board[condition[1]];
                const cellC = board[condition[2]];

                if (cellA === "" || cellB === "" || cellC === "") continue;
                if (cellA === cellB && cellB === cellC) {
                    roundWon = true;
                    break;
                }
            }

            if (roundWon) {
                let winnerSymbol = "";
                if (currentPlayer === "X") {
                    winnerSymbol = customSymbol1 ? `<img src="${customSymbol1}" alt="P1">` : "X";
                } else {
                    winnerSymbol = customSymbol2 ? `<img src="${customSymbol2}" alt="P2">` : "O";
                }

                statusText.innerHTML = `🎉 ${winnerSymbol} MENANG! 🎉`;
                statusText.classList.add('win-text');
                boardElement.classList.add(`win-${currentPlayer.toLowerCase()}`);
                
                cells.forEach(c => c.classList.remove('warning'));
                isGameRunning = false;
            } else {
                changePlayer();
            }
        }

        function resetBoard() {
            currentPlayer = "X";
            board = ["", "", "", "", "", "", "", "", ""];
            movesX = [];
            movesO = [];
            
            boardElement.classList.remove('win-x', 'win-o');
            statusText.classList.remove('win-text');
            
            cells.forEach(cell => {
                cell.innerHTML = "";
                cell.classList.remove('x', 'o', 'warning');
            });
            
            updateStatusText();
            isGameRunning = true;
        }
    </script>
</body>
</html>
